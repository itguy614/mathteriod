<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mathteroid · game dev harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game-root { position: fixed; inset: 0; }
      #dev-toggle {
        position: fixed; left: 12px; bottom: 12px; z-index: 20;
        font: 700 13px system-ui, sans-serif; padding: 6px 10px; border-radius: 8px;
        border: 1px solid #4a5b8a; background: #111a33; color: #cfe0ff; cursor: pointer;
      }
      #dev-panel {
        position: fixed; left: 12px; bottom: 48px; z-index: 20; width: 270px;
        max-height: calc(100% - 70px); overflow: auto;
        font: 13px system-ui, sans-serif; color: #dbe6ff;
        background: rgba(10, 14, 32, 0.92); border: 1px solid #34426b; border-radius: 10px; padding: 10px;
      }
      #dev-panel.hidden { display: none; }
      #dev-panel label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; gap: 8px; }
      #dev-panel select, #dev-panel input[type=number] { width: 130px; background: #0b1024; color: #fff; border: 1px solid #34426b; border-radius: 4px; padding: 2px 4px; }
      #dev-panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      #dev-panel button { flex: 1 1 auto; padding: 6px 8px; border-radius: 6px; border: 1px solid #4a5b8a; background: #1b2a55; color: #fff; cursor: pointer; font-weight: 700; }
      #dev-panel button:hover { background: #26397a; }
      #dev-log { margin-top: 8px; height: 140px; overflow: auto; font: 11px ui-monospace, monospace; background: #050814; padding: 4px; border-radius: 4px; white-space: pre-wrap; }
      h3 { margin: 6px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8fa6dd; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <button id="dev-toggle" type="button">Dev ▾</button>
    <div id="dev-panel"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
